# PowerSync sync rules for Jar
#
# These rules decide what reaches a device. PowerSync connects with a BYPASSRLS role
# and reads the write-ahead log, so the RLS policies in supabase/migrations/ do NOT
# constrain replication — they only guard writes through the Supabase Data API.
# A gap here leaks data even though RLS is correct. See ADR-0004.
#
# Scoping principle, mirroring docs/data-model.md:
#   household-scoped rows  → only for households the user belongs to
#   user-scoped rows       → the user's own, plus their household co-members'
#                            (Filters aggregate members' Ratings, so they must be local)
#   global rows            → only the subset the user's libraries actually reference,
#                            so a device never replicates the whole title catalogue
#
# ── Do not alias the table being selected from ──────────────────────────────
#
# A row is published under the name it is selected as, so `SELECT h.* FROM household h`
# syncs into a local table called `h`. src/lib/db/schema.ts declares `household`, so
# every such query would sync perfectly and land somewhere nothing reads — an account
# that looks empty rather than broken.
#
# Joined tables are different: their aliases exist only to write the ON clause and never
# reach the client, so `hm`, `le` and friends are kept for brevity. Only the source table
# is spelled out in full. The dashboard validator warns about this; heed it.

config:
  edition: 3

streams:
  # --- Membership and people -------------------------------------------------

  households:
    auto_subscribe: true
    queries:
      - SELECT household.* FROM household
        INNER JOIN household_member hm ON hm.household_id = household.id
        WHERE hm.user_id = auth.user_id()

      # Every membership row of every household I'm in, so the app knows who my
      # co-members are and can resolve default rater populations. The second copy of
      # the table is the one that gets an alias, since the source cannot have one.
      - SELECT household_member.* FROM household_member
        INNER JOIN household_member me ON me.household_id = household_member.household_id
        WHERE me.user_id = auth.user_id()

      # Display names for those co-members.
      - SELECT app_user.* FROM app_user
        INNER JOIN household_member peer ON peer.user_id = app_user.id
        INNER JOIN household_member me ON me.household_id = peer.household_id
        WHERE me.user_id = auth.user_id()

      # My own row, unconditionally. The query above reaches it only through a
      # membership, so a user who belongs to no household yet — every user, between
      # signing up and creating one — would not receive their own display name on a
      # fresh install, and the app would offer to onboard someone it cannot name.
      - SELECT app_user.* FROM app_user
        WHERE app_user.id = auth.user_id()

  # --- Library and vocabulary ------------------------------------------------

  library:
    auto_subscribe: true
    queries:
      - SELECT library_entry.* FROM library_entry
        INNER JOIN household_member hm ON hm.household_id = library_entry.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT tag.* FROM tag
        INNER JOIN household_member hm ON hm.household_id = tag.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT title_tag.* FROM title_tag
        INNER JOIN household_member hm ON hm.household_id = title_tag.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT household_category.* FROM household_category
        INNER JOIN household_member hm ON hm.household_id = household_category.household_id
        WHERE hm.user_id = auth.user_id()

  # --- Global catalogue, narrowed to what my libraries reference -------------
  #
  # Titles are global (ADR-0007) but a device must not replicate every film in the
  # app. Scope to titles my households actually hold.

  catalogue:
    auto_subscribe: true
    queries:
      - SELECT title.* FROM title
        INNER JOIN library_entry le ON le.title_id = title.id
        INNER JOIN household_member hm ON hm.household_id = le.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT title_genre.* FROM title_genre
        INNER JOIN library_entry le ON le.title_id = title_genre.title_id
        INNER JOIN household_member hm ON hm.household_id = le.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT title_credit.* FROM title_credit
        INNER JOIN library_entry le ON le.title_id = title_credit.title_id
        INNER JOIN household_member hm ON hm.household_id = le.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT person.* FROM person
        INNER JOIN title_credit tc ON tc.person_id = person.id
        INNER JOIN library_entry le ON le.title_id = tc.title_id
        INNER JOIN household_member hm ON hm.household_id = le.household_id
        WHERE hm.user_id = auth.user_id()

  # Rating Categories are a small global catalogue — sync all of them so the filter
  # builder and rating UI can resolve any category a Rating references.
  categories:
    auto_subscribe: true
    queries:
      - SELECT * FROM rating_category

  # --- Jars and draws --------------------------------------------------------

  jars:
    auto_subscribe: true
    queries:
      - SELECT jar.* FROM jar
        INNER JOIN household_member hm ON hm.household_id = jar.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT jar_override.* FROM jar_override
        INNER JOIN jar j ON j.id = jar_override.jar_id
        INNER JOIN household_member hm ON hm.household_id = j.household_id
        WHERE hm.user_id = auth.user_id()

  draws:
    auto_subscribe: true
    queries:
      - SELECT draw.* FROM draw
        INNER JOIN jar j ON j.id = draw.jar_id
        INNER JOIN household_member hm ON hm.household_id = j.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT draw_participant.* FROM draw_participant
        INNER JOIN draw d ON d.id = draw_participant.draw_id
        INNER JOIN jar j ON j.id = d.jar_id
        INNER JOIN household_member hm ON hm.household_id = j.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT draw_candidate.* FROM draw_candidate
        INNER JOIN draw d ON d.id = draw_candidate.draw_id
        INNER JOIN jar j ON j.id = d.jar_id
        INNER JOIN household_member hm ON hm.household_id = j.household_id
        WHERE hm.user_id = auth.user_id()

  # --- Opinions --------------------------------------------------------------
  #
  # Ratings and Viewings belong to Users, not Households, but a Filter aggregates the
  # ratings of everyone in the household — so co-members' rows must be on the device
  # for jar contents to be computable offline.

  opinions:
    auto_subscribe: true
    queries:
      - SELECT rating.* FROM rating
        INNER JOIN household_member peer ON peer.user_id = rating.user_id
        INNER JOIN household_member me ON me.household_id = peer.household_id
        WHERE me.user_id = auth.user_id()

      - SELECT viewing.* FROM viewing
        INNER JOIN household_member peer ON peer.user_id = viewing.user_id
        INNER JOIN household_member me ON me.household_id = peer.household_id
        WHERE me.user_id = auth.user_id()
