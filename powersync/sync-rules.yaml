# PowerSync sync rules for Jar
#
# ⚠️  DRAFT — not yet validated against a PowerSync instance. Validate in the
#     PowerSync Dashboard's Sync Streams view before deploying.
#
# These rules decide what reaches a device. PowerSync connects with a BYPASSRLS role
# and reads the write-ahead log, so the RLS policies in supabase/migrations/ do NOT
# constrain replication — they only guard writes through the Supabase Data API.
# A gap here leaks data even though RLS is correct. See ADR-0004.
#
# Scoping principle, mirroring docs/data-model.md:
#   household-scoped rows  → only for households the user belongs to
#   user-scoped rows       → the user's own, plus their household co-members'
#                            (Filters aggregate members' Ratings, so they must be local)
#   global rows            → only the subset the user's libraries actually reference,
#                            so a device never replicates the whole title catalogue

config:
  edition: 3

streams:
  # --- Membership and people -------------------------------------------------

  households:
    auto_subscribe: true
    queries:
      - SELECT h.* FROM household h
        INNER JOIN household_member hm ON hm.household_id = h.id
        WHERE hm.user_id = auth.user_id()

      # Every membership row of every household I'm in, so the app knows who my
      # co-members are and can resolve default rater populations.
      - SELECT peer.* FROM household_member peer
        INNER JOIN household_member me ON me.household_id = peer.household_id
        WHERE me.user_id = auth.user_id()

      # Display names for those co-members.
      - SELECT u.* FROM app_user u
        INNER JOIN household_member peer ON peer.user_id = u.id
        INNER JOIN household_member me ON me.household_id = peer.household_id
        WHERE me.user_id = auth.user_id()

  # --- Library and vocabulary ------------------------------------------------

  library:
    auto_subscribe: true
    queries:
      - SELECT le.* FROM library_entry le
        INNER JOIN household_member hm ON hm.household_id = le.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT t.* FROM tag t
        INNER JOIN household_member hm ON hm.household_id = t.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT tt.* FROM title_tag tt
        INNER JOIN household_member hm ON hm.household_id = tt.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT hc.* FROM household_category hc
        INNER JOIN household_member hm ON hm.household_id = hc.household_id
        WHERE hm.user_id = auth.user_id()

  # --- Global catalogue, narrowed to what my libraries reference -------------
  #
  # Titles are global (ADR-0007) but a device must not replicate every film in the
  # app. Scope to titles my households actually hold.

  catalogue:
    auto_subscribe: true
    queries:
      - SELECT ti.* FROM title ti
        INNER JOIN library_entry le ON le.title_id = ti.id
        INNER JOIN household_member hm ON hm.household_id = le.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT tg.* FROM title_genre tg
        INNER JOIN library_entry le ON le.title_id = tg.title_id
        INNER JOIN household_member hm ON hm.household_id = le.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT tc.* FROM title_credit tc
        INNER JOIN library_entry le ON le.title_id = tc.title_id
        INNER JOIN household_member hm ON hm.household_id = le.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT p.* FROM person p
        INNER JOIN title_credit tc ON tc.person_id = p.id
        INNER JOIN library_entry le ON le.title_id = tc.title_id
        INNER JOIN household_member hm ON hm.household_id = le.household_id
        WHERE hm.user_id = auth.user_id()

  # Rating Categories are a small global catalogue — sync all of them so the filter
  # builder and rating UI can resolve any category a Rating references.
  categories:
    auto_subscribe: true
    queries:
      - SELECT * FROM rating_category

  # --- Jars and draws --------------------------------------------------------

  jars:
    auto_subscribe: true
    queries:
      - SELECT j.* FROM jar j
        INNER JOIN household_member hm ON hm.household_id = j.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT jo.* FROM jar_override jo
        INNER JOIN jar j ON j.id = jo.jar_id
        INNER JOIN household_member hm ON hm.household_id = j.household_id
        WHERE hm.user_id = auth.user_id()

  draws:
    auto_subscribe: true
    queries:
      - SELECT d.* FROM draw d
        INNER JOIN jar j ON j.id = d.jar_id
        INNER JOIN household_member hm ON hm.household_id = j.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT dp.* FROM draw_participant dp
        INNER JOIN draw d ON d.id = dp.draw_id
        INNER JOIN jar j ON j.id = d.jar_id
        INNER JOIN household_member hm ON hm.household_id = j.household_id
        WHERE hm.user_id = auth.user_id()

      - SELECT dc.* FROM draw_candidate dc
        INNER JOIN draw d ON d.id = dc.draw_id
        INNER JOIN jar j ON j.id = d.jar_id
        INNER JOIN household_member hm ON hm.household_id = j.household_id
        WHERE hm.user_id = auth.user_id()

  # --- Opinions --------------------------------------------------------------
  #
  # Ratings and Viewings belong to Users, not Households, but a Filter aggregates the
  # ratings of everyone in the household — so co-members' rows must be on the device
  # for jar contents to be computable offline.

  opinions:
    auto_subscribe: true
    queries:
      - SELECT r.* FROM rating r
        INNER JOIN household_member peer ON peer.user_id = r.user_id
        INNER JOIN household_member me ON me.household_id = peer.household_id
        WHERE me.user_id = auth.user_id()

      - SELECT v.* FROM viewing v
        INNER JOIN household_member peer ON peer.user_id = v.user_id
        INNER JOIN household_member me ON me.household_id = peer.household_id
        WHERE me.user_id = auth.user_id()
